Version: "3.8"

services:
  nginx:
    build: ./nginx
    image: nginx 
    container_name: nginx_cont
    port:
      - "80:80"
    restart: always
    depends_on:
      - django_app
    nwtwork:
     - notes_app_nw

djang_app:
   build: 
      context: .
   image: django_app
   container_name: django_app_cont
   port:
     - "8000:8000" 
   command: sh -c "python manage.py migrate --noinput && gunicorn notesapp.wsgi --bind 0.0.0.0:8000"
   env_file:
    - ".env"
   depend_on:
     db:
         condition: service_healthy
    restart: alwyas
    network:
      - notes_app_nw
db:
  image: mysql
  container_name: db_cont
  environment:
    - MYSQL_ROOT_PASSWORD=root
    - MYSQL_DATABASE=test_db
  volume:
   - ./data/mysql/db/:/var/lib/mysql
  healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  network:
      - notes_app_nw

network:
      - notes_app_nw
      
   
   
   

  
